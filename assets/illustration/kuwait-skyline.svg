<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <!-- water ripple lines -->
  <g stroke="#FFFFFF" fill="none">
    <path d="M0,392 Q400,388 800,392 T1600,390" stroke-width="1" opacity="0.05"/>
    <path d="M0,414 Q400,419 800,414 T1600,417" stroke-width="1" opacity="0.045"/>
    <path d="M0,438 Q400,433 800,439 T1600,435" stroke-width="1" opacity="0.04"/>
    <path d="M0,460 Q400,464 800,459 T1600,462" stroke-width="1" opacity="0.035"/>
  </g>

  <!-- corniche ground line -->
  <path d="M0,360 Q800,353 1600,359" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.1"/>

  <!-- light poles -->
  <g>
    <line x1="420" y1="362" x2="420" y2="322" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/><circle cx="420" cy="322" r="2.2" fill="#FFFFFF" opacity="0.15"/>
    <line x1="515" y1="362" x2="515" y2="322" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/><circle cx="515" cy="322" r="2.2" fill="#FFFFFF" opacity="0.15"/>
    <line x1="610" y1="362" x2="610" y2="322" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/><circle cx="610" cy="322" r="2.2" fill="#FFFFFF" opacity="0.15"/>
    <line x1="705" y1="362" x2="705" y2="322" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/><circle cx="705" cy="322" r="2.2" fill="#FFFFFF" opacity="0.15"/>
    <line x1="800" y1="362" x2="800" y2="322" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/><circle cx="800" cy="322" r="2.2" fill="#FFFFFF" opacity="0.15"/>
    <line x1="895" y1="362" x2="895" y2="322" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/><circle cx="895" cy="322" r="2.2" fill="#FFFFFF" opacity="0.15"/>
    <line x1="990" y1="362" x2="990" y2="322" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/><circle cx="990" cy="322" r="2.2" fill="#FFFFFF" opacity="0.15"/>
    <line x1="1085" y1="362" x2="1085" y2="322" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/><circle cx="1085" cy="322" r="2.2" fill="#FFFFFF" opacity="0.15"/>
  </g>

  <!-- dhow boat, foreground -->
  <g transform="translate(230,362)" opacity="0.2">
    <path d="M-92,9 Q-94,26 -72,27 L92,27 Q112,27 118,7 L98,7 C92,15 79,17 60,17 L-60,17 C-74,17 -84,14 -92,9 Z" fill="#FFFFFF"/>
    <line x1="-8" y1="7" x2="-8" y2="-56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M-8,-56 L44,-27 L-8,-18 Z" fill="#FFFFFF" opacity="0.62"/>
  </g>
  <!-- boat reflection -->
  <g transform="translate(230,384) scale(1,-0.32)" opacity="0.05">
    <path d="M-92,9 Q-94,26 -72,27 L92,27 Q112,27 118,7 L98,7 C92,15 79,17 60,17 L-60,17 C-74,17 -84,14 -92,9 Z" fill="#FFFFFF"/>
  </g>

  <!-- Kuwait Towers reflection (mirrored, compressed, faint) -->
  <g transform="translate(0,724) scale(1,-1)" opacity="0.05">
    <line x1="1230" y1="362" x2="1230" y2="150" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="1230" cy="146" r="3" fill="#FFFFFF"/>
    <line x1="1310" y1="362" x2="1310" y2="120" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="1310" cy="238" r="20" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="1400" y1="362" x2="1400" y2="96" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="1400" cy="288" r="34" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
  </g>

  <!-- Kuwait Towers -->
  <g>
    <!-- thin spire tower -->
    <line x1="1230" y1="362" x2="1230" y2="150" stroke="#FFFFFF" stroke-width="2" opacity="0.22"/>
    <circle cx="1230" cy="146" r="3" fill="#FFFFFF" opacity="0.28"/>

    <!-- small-ball tower -->
    <line x1="1310" y1="362" x2="1310" y2="120" stroke="#FFFFFF" stroke-width="2.5" opacity="0.24"/>
    <circle cx="1310" cy="238" r="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    <circle cx="1310" cy="238" r="12" fill="#FFFFFF" opacity="0.12"/>

    <!-- main tower, big ball -->
    <line x1="1400" y1="362" x2="1400" y2="96" stroke="#FFFFFF" stroke-width="3" opacity="0.26"/>
    <circle cx="1400" cy="288" r="34" fill="none" stroke="#FFFFFF" stroke-width="2.2" opacity="0.34"/>
    <circle cx="1400" cy="288" r="21" fill="#FFFFFF" opacity="0.14"/>
  </g>
</svg>
